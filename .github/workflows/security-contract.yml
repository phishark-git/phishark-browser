name: Security contract
on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Native Android policy conformance
        run: |
          node scripts/native-vectors.mjs
          g++ -std=c++17 -Wall -Wextra -Werror -I.build/native android/security/verdict_test.cc -o .build/native/verdict-test
          .build/native/verdict-test
